# Nginx configuration for The Transformation Engine
# This config sets up HTTPS with the mkcert certificates and proxies to the app
#
# Note: This file uses absolute paths that will be replaced by setup.sh
# based on your operating system (macOS or Linux)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # MIME_TYPES_PATH will be replaced by setup.sh
    include       MIME_TYPES_PATH;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # HTTPS server
    server {
        listen 1847 ssl;
        server_name localhost;

        # SSL certificates (mkcert) - paths replaced by setup.sh
        ssl_certificate     PROJECT_ROOT/localhost+2.pem;
        ssl_certificate_key PROJECT_ROOT/localhost+2-key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Root directory for static files - path replaced by setup.sh
        root PROJECT_ROOT/dist;
        index index.html;

        # Serve static files with caching
        location / {
            try_files $uri $uri/ /index.html;

            # Cache control for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy (adjust as needed for your app)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com https://openrouter.ai https://api.openai.com;" always;

        # SPA fallback - serve index.html for all routes
        error_page 404 /index.html;

        # Logging - paths replaced by setup.sh
        access_log NGINX_LOG_DIR/tte_access.log;
        error_log NGINX_LOG_DIR/tte_error.log;
    }

    # HTTP redirect to HTTPS
    server {
        listen 7392;
        server_name localhost;
        return 301 https://$server_name:1847$request_uri;
    }
}
